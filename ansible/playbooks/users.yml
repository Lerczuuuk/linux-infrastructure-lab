---

- name: Creating "ansible" user
  hosts: all
  become: true

  tasks:
    - name: Create user
      ansible.builtin.user:
        name: ansible
        groups: sudo
        append: true
    - name: Set authorized SSH key for ansible user
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
